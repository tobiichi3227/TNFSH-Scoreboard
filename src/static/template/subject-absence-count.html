<script>
    function init() {
        const { createApp, ref, onMounted, computed } = Vue;
        createApp({
            components: {
                'data-status-indicator': DataStatusIndicator
            },
            setup() {
                const subject_absence_cnts = ref({});
                const loading = ref(true);
                const isFromCache = ref(false);
                const isFresh = ref(false);
                const isOffline = ref(false);
                const formattedCacheTime = ref(null);
                const error = ref(null);

                const loadData = async () => {
                    loading.value = true;
                    error.value = null;
                    let url = `${route.base_url}/be/subjectabsence?format=json&cache=${new Date().getTime()}`;

                    await fetchWithCache(
                        url,
                        // onCachedData
                        (data, metadata) => {
                            subject_absence_cnts.value = data.subject_absence_cnts || {};
                            isFromCache.value = true;
                            isFresh.value = false;
                            formattedCacheTime.value = metadata.formattedTime;
                            isOffline.value = !metadata.isOnline;
                            loading.value = !metadata.isOnline;
                        },
                        // onFreshData
                        (data) => {
                            subject_absence_cnts.value = data.subject_absence_cnts || {};
                            isFromCache.value = false;
                            isFresh.value = true;
                            loading.value = false;
                            formattedCacheTime.value = CacheManager.formatTimestamp(Date.now());
                            isOffline.value = false;
                            error.value = null;
                        },
                        // onError
                        (err, hasCachedData) => {
                            error.value = err;
                            loading.value = false;
                            isOffline.value = !CacheManager.isOnline();
                            if (!hasCachedData) {
                                subject_absence_cnts.value = {};
                            }
                        }
                    );
                };

                const sortedSubjects = computed(() => {
                    const entries = Object.entries(subject_absence_cnts.value);
                    return entries.sort((a, b) => b[1] - a[1]);
                });

                const hasAbsences = computed(() => {
                    return Object.keys(subject_absence_cnts.value).length > 0;
                });

                onMounted(() => {
                    loadData();
                });

                return {
                    subject_absence_cnts,
                    loading,
                    isFromCache,
                    isFresh,
                    isOffline,
                    formattedCacheTime,
                    error,
                    sortedSubjects,
                    hasAbsences,
                };
            }
        }).mount('#subject-absence-app');
    }
    init();
</script>

<div id="subject-absence-app" class="row">
    <data-status-indicator
        :loading="loading"
        :is-from-cache="isFromCache"
        :is-fresh="isFresh"
        :is-offline="isOffline"
        :formatted-cache-time="formattedCacheTime"
        :error="error"
    ></data-status-indicator>

    <div v-if="loading && !isFromCache" class="text-center my-5">
        <div class="spinner-border text-secondary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    <template v-else>
        <table v-if="hasAbsences" class="table table-responsive-sm col-12 mx-lg-3 my-3">
            <thead>
                <tr>
                    <th scope="col">科目</th>
                    <th scope="col">缺席數</th>
                </tr>
            </thead>

            <tbody>
                <tr v-for="[subject_name, cnt] in sortedSubjects" :key="subject_name">
                    <th scope="row" v-text="subject_name"></th>
                    <td v-text="cnt"></td>
                </tr>
            </tbody>
        </table>
        <h1 v-else>沒有任何缺席</h1>
    </template>
</div>
