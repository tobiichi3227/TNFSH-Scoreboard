<script>
    function init() {
        const { createApp, ref, onMounted, computed } = Vue;
        createApp({
            components: {
                'data-status-indicator': DataStatusIndicator
            },
            setup() {
                const credits = ref([0, 0, 0]);
                const final_credit = ref([0, 0, 0]);
                const student_class_number = ref(0);
                const loading = ref(true);
                const isFromCache = ref(false);
                const isFresh = ref(false);
                const isOffline = ref(false);
                const formattedCacheTime = ref(null);
                const error = ref(null);

                const loadData = async () => {
                    loading.value = true;
                    error.value = null;
                    let url = `${route.base_url}/be/graduation?format=json&cache=${new Date().getTime()}`;

                    await fetchWithCache(
                        url,
                        // onCachedData
                        (data, metadata) => {
                            credits.value = data.credits || [0, 0, 0];
                            final_credit.value = data.final_credit || [0, 0, 0];
                            student_class_number.value = data.student_class_number || 0;
                            isFromCache.value = true;
                            isFresh.value = false;
                            formattedCacheTime.value = metadata.formattedTime;
                            isOffline.value = !metadata.isOnline;
                            loading.value = !metadata.isOnline;
                        },
                        // onFreshData
                        (data) => {
                            credits.value = data.credits || [0, 0, 0];
                            final_credit.value = data.final_credit || [0, 0, 0];
                            student_class_number.value = data.student_class_number || 0;
                            isFromCache.value = false;
                            isFresh.value = true;
                            loading.value = false;
                            formattedCacheTime.value = CacheManager.formatTimestamp(Date.now());
                            isOffline.value = false;
                            error.value = null;
                        },
                        // onError
                        (err, hasCachedData) => {
                            error.value = err;
                            loading.value = false;
                            isOffline.value = !CacheManager.isOnline();
                            if (!hasCachedData) {
                                credits.value = [0, 0, 0];
                                final_credit.value = [0, 0, 0];
                                student_class_number.value = 0;
                            }
                        }
                    );
                };

                const getCreditStatusColor = (pass_c, final_c, require_c) => {
                    if (pass_c >= require_c) {
                        return '';
                    } else if (pass_c + final_c >= require_c) {
                        return '#ffc107';
                    } else if (pass_c + final_c < require_c) {
                        return '#dc3545';
                    }
                    return '';
                };

                const totalCredits = computed(() => {
                    return credits.value.reduce((a, b) => a + b, 0);
                });

                const classNumber = computed(() => {
                    return student_class_number.value % 100;
                });

                const hasCredits = computed(() => {
                    return totalCredits.value > 0;
                });

                const isRegularClass = computed(() => {
                    const cn = classNumber.value;
                    return cn <= 17 || cn === 19;
                });

                const isClass18 = computed(() => {
                    return classNumber.value === 18;
                });

                const semesterCreditsText = computed(() => {
                    return `本學期部定必修學分: ${final_credit.value[0]} 校訂必修學分: ${final_credit.value[1]} 校選學分: ${final_credit.value[2]}`;
                });

                onMounted(() => {
                    loadData();
                });

                return {
                    credits,
                    final_credit,
                    loading,
                    isFromCache,
                    isFresh,
                    isOffline,
                    formattedCacheTime,
                    error,
                    getCreditStatusColor,
                    totalCredits,
                    classNumber,
                    hasCredits,
                    isRegularClass,
                    isClass18,
                    semesterCreditsText,
                };
            }
        }).mount('#graduation-app');
    }
    init();
</script>

<div id="graduation-app" class="row">
    <data-status-indicator
        :loading="loading"
        :is-from-cache="isFromCache"
        :is-fresh="isFresh"
        :is-offline="isOffline"
        :formatted-cache-time="formattedCacheTime"
        :error="error"
    ></data-status-indicator>

    <div v-if="loading && !isFromCache" class="text-center my-5">
        <div class="spinner-border text-secondary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    <template v-else>
        <template v-if="hasCredits">
            <div class="mx-lg-3 my-1">
                <p><span style="color: #ffc107">黃色</span>表示本學期可以將剩餘的學分修完</p>
                <p><span style="color: #dc3545">紅色</span>表示本學期沒辦法將剩餘的學分修完</p>
                <p>可能是前五個學期學分不夠或是本學期某些學科缺席超過1/3(自己把自己當掉)</p>
                <p v-text="semesterCreditsText"></p>
            </div>
            <table class="table col-12 mx-lg-3">
                <thead>
                    <tr>
                        <th scope="col">項目</th>
                        <th scope="col">實得學分</th>
                        <th scope="col">最低學分</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <th scope="row">總學分</th>
                        <td v-text="totalCredits"></td>
                        <td>150</td>
                    </tr>

                    <template v-if="isRegularClass">
                        <tr>
                            <th scope="row">必修學分</th>
                            <td :style="getCreditStatusColor(credits[0] + credits[1], final_credit[0] + final_credit[1], 102) ? `color: ${getCreditStatusColor(credits[0] + credits[1], final_credit[0] + final_credit[1], 102)}` : ''" 
                                v-text="credits[0] + credits[1]"></td>
                            <td>102</td>
                        </tr>
                        <tr>
                            <th scope="row">選修學分</th>
                            <td :style="getCreditStatusColor(credits[2], final_credit[2], 40) ? `color: ${getCreditStatusColor(credits[2], final_credit[2], 40)}` : ''" 
                                v-text="credits[2]"></td>
                            <td>40</td>
                        </tr>
                    </template>

                    <template v-else-if="isClass18">
                        <tr>
                            <th scope="row">部定必修學分</th>
                            <td :style="getCreditStatusColor(credits[0], final_credit[0], 80) ? `color: ${getCreditStatusColor(credits[0], final_credit[0], 80)}` : ''" 
                                v-text="credits[0]"></td>
                            <td>80</td>
                        </tr>
                        <tr>
                            <th scope="row">校定必修學分</th>
                            <td :style="getCreditStatusColor(credits[1], final_credit[1], 24) ? `color: ${getCreditStatusColor(credits[1], final_credit[1], 24)}` : ''" 
                                v-text="credits[1]"></td>
                            <td>24</td>
                        </tr>
                        <tr>
                            <th scope="row">選修學分</th>
                            <td :style="getCreditStatusColor(credits[2], final_credit[2], 37) ? `color: ${getCreditStatusColor(credits[2], final_credit[2], 37)}` : ''" 
                                v-text="credits[2]"></td>
                            <td>37</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>
        <h1 v-else>無法計算畢業學分，校務系統不提供資料</h1>
    </template>
</div>
