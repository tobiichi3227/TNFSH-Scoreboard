<style>
.gray-line {
    border:0;
    border-top-width:2px;
    border-top-color:#ced4da;
    border-top-style:solid;
    margin:0;
    margin-top:20px;
    margin-bottom:20px;
}
</style>

<script>
    function init() {
        const { createApp, ref, onMounted, computed } = Vue;
        createApp({
            components: {
                'data-status-indicator': DataStatusIndicator
            },
            setup() {
                const item_ids = ref([]);
                const scores = ref(null);
                const stats = ref(null);
                const selected_exam = ref("-1,-1");
                const loading = ref(true);
                const isFromCache = ref(false);
                const isFresh = ref(false);
                const isOffline = ref(false);
                const formattedCacheTime = ref(null);
                const error = ref(null);

                const loadData = async () => {
                    loading.value = true;
                    error.value = null;
                    const urlParams = new URLSearchParams(window.location.search);
                    const itemId = urlParams.get('itemId');
                    const stdSemeId = urlParams.get('stdSemeId');

                    let url = `${route.base_url}/be/exam?format=json&cache=${new Date().getTime()}`;
                    if (itemId && stdSemeId) {
                        url += `&itemId=${itemId}&stdSemeId=${stdSemeId}`;
                        selected_exam.value = `${stdSemeId},${itemId}`;
                    }

                    await fetchWithCache(
                        url,
                        // onCachedData
                        (data, metadata) => {
                            item_ids.value = data.item_ids || [];
                            scores.value = data.scores;
                            stats.value = data.stats;
                            isFromCache.value = true;
                            isFresh.value = false;
                            formattedCacheTime.value = metadata.formattedTime;
                            isOffline.value = !metadata.isOnline;
                            loading.value = !metadata.isOnline; // Stop loading only if offline
                        },
                        // onFreshData
                        (data) => {
                            item_ids.value = data.item_ids || [];
                            scores.value = data.scores;
                            stats.value = data.stats;
                            isFromCache.value = false;
                            isFresh.value = true;
                            loading.value = false;
                            formattedCacheTime.value = CacheManager.formatTimestamp(Date.now());
                            isOffline.value = false;
                            error.value = null;
                        },
                        // onError
                        (err, hasCachedData) => {
                            error.value = err;
                            loading.value = false;
                            isOffline.value = !CacheManager.isOnline();
                            if (!hasCachedData) {
                                item_ids.value = [];
                                scores.value = null;
                                stats.value = null;
                            }
                        }
                    );
                };

                const onExamChange = (event) => {
                    const [std_seme_id, item_id] = event.target.value.split(",");

                    if (std_seme_id === "-1" || item_id === "-1") {
                        return;
                    }

                    let url = `${route.base_url}/exam/?`;
                    url += `stdSemeId=${std_seme_id}`;
                    url += `&itemId=${item_id}`;

                    route.go(url);
                };

                const getSemeName = (seme) => {
                    return seme === 1 ? "上" : "下";
                };

                const getExamOptionText = (score_obj) => {
                    return `${score_obj.year} ${getSemeName(score_obj.seme)} ${score_obj.exam_name}`;
                };

                const formatScore = (score) => {
                    if (score.is_participated !== "否") {
                        return { text: "缺考", failed: false };
                    }
                    if (!score.score || score.score === "") {
                        return { text: "尚未公布", failed: false };
                    }
                    const scoreValue = parseFloat(score.score);
                    return {
                        text: score.score,
                        failed: scoreValue < 60
                    };
                };

                const formatRank = (rank) => {
                    if (rank === undefined || rank === null) {
                        return "無資料";
                    }
                    if (rank === "") {
                        return "尚未公佈";
                    }
                    return rank;
                };

                const formatAverage = (average) => {
                    if (!average || average === "") {
                        return "尚未公佈";
                    }
                    return average;
                };

                const formatStatsValue = (value) => {
                    if (!value || value === "") {
                        return "尚未公佈";
                    }
                    return value;
                };

                const formatStatsRank = (rank, cnt) => {
                    if (!rank || rank === "") {
                        return "尚未公佈";
                    }
                    return `${rank} / ${cnt}`;
                };

                onMounted(() => {
                    loadData();
                });

                return {
                    item_ids,
                    scores,
                    stats,
                    selected_exam,
                    loading,
                    isFromCache,
                    isFresh,
                    isOffline,
                    formattedCacheTime,
                    error,
                    onExamChange,
                    getSemeName,
                    getExamOptionText,
                    formatScore,
                    formatRank,
                    formatAverage,
                    formatStatsValue,
                    formatStatsRank,
                };
            }
        }).mount('#exam-app');
    }
    init();
</script>

<div id="exam-app" class="row">
    <data-status-indicator
        :loading="loading"
        :is-from-cache="isFromCache"
        :is-fresh="isFresh"
        :is-offline="isOffline"
        :formatted-cache-time="formattedCacheTime"
        :error="error"
    ></data-status-indicator>

    <div v-if="loading && !isFromCache" class="text-center my-5">
        <div class="spinner-border text-secondary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    <template v-else>
        <select class="form-select my-3 col-12" @change="onExamChange" v-model="selected_exam">
            <option value="-1,-1">請選擇段考</option>
            <option v-for="score_obj in item_ids"
                    :key="`${score_obj.stdSemeId}-${score_obj.itemId}`"
                    :value="`${score_obj.stdSemeId},${score_obj.itemId}`"
                    :text="getExamOptionText(score_obj)">
            </option>
        </select>

        <template v-if="scores !== null">
            <table v-if="stats !== null" class="table table-responsive-sm col-12 mx-lg-3">
                <thead>
                    <tr>
                        <th scope="col">總分</th>
                        <th scope="col">平均</th>
                        <th scope="col">班排</th>
                        <th scope="col">組排</th>
                        <th scope="col">校排</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td v-text="formatStatsValue(stats.score_sum)"></td>
                        <td v-text="stats.average ? Math.round(parseFloat(stats.average) * 100) / 100 : '尚未公佈'"></td>
                        <td v-text="formatStatsRank(stats.class_rank, stats.class_cnt)"></td>
                        <td v-text="formatStatsRank(stats.group_rank, stats.group_cnt)"></td>
                        <td v-text="formatStatsRank(stats.all_rank, stats.all_cnt)"></td>
                    </tr>
                </tbody>
            </table>

            <table class="table col-12 mx-lg-3 my-3">
                <thead>
                    <tr>
                        <th scope="col">科目</th>
                        <th scope="col">學分</th>
                        <th scope="col">分數</th>
                        <th scope="col">班排</th>
                        <th scope="col">組排</th>
                        <th scope="col">班平均</th>
                    </tr>
                </thead>

                <tbody>
                    <tr v-for="score in scores" :key="score.subject">
                        <th scope="row" v-text="score.subject"></td>
                        <td v-text="parseInt(score.credits)"></td>
                        <td :style="formatScore(score).failed ? 'color: #dc3545' : ''"
                            v-text="formatScore(score).text"></td>
                        <td v-text="formatRank(score.class_rank)"></td>
                        <td v-text="formatRank(score.group_rank)"></td>
                        <td v-text="formatAverage(score.class_average)"></td>
                    </tr>
                </tbody>
            </table>
        </template>
    </template>
</div>
