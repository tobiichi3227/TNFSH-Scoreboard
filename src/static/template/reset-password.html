<script>
    function init() {
        const { createApp, ref, useTemplateRef } = Vue;
        const PasswordInput = {
            props: {
                modelValue: { type: String, required: true },
                placeholder: { type: String, default: '' },
                invalidFeedBack: { type: String, required: true },
                required: { type: Boolean, default: false },
                ariaLabel: { type: String, default: 'password eye' },
            },
            emits: ['update:modelValue'],
            setup(props, { emit }) {
                const visible = ref(false);
                const toggle = () => { visible.value = !visible.value; }
                const onInput = (event) => { emit('update:modelValue', event.target.value); }
                return { visible, toggle, onInput };
            },
            template: `
                <div class="input-group">
                    <input @input="onInput" :value="modelValue" :type="visible ? 'text' : 'password'" class="form-control needs-validation" :placeholder="placeholder" :required="required"/>
                    <button @click="toggle" type="button" class="input-group-text" :aria-label="ariaLabel">
                        <svg v-if="!visible" width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.5 11C4.80285 11 2.52952 9.62184 1.09622 7.50001C2.52952 5.37816 4.80285 4 7.5 4C10.1971 4 12.4705 5.37816 13.9038 7.50001C12.4705 9.62183 10.1971 11 7.5 11ZM7.5 3C4.30786 3 1.65639 4.70638 0.0760002 7.23501C-0.0253338 7.39715 -0.0253334 7.60288 0.0760014 7.76501C1.65639 10.2936 4.30786 12 7.5 12C10.6921 12 13.3436 10.2936 14.924 7.76501C15.0253 7.60288 15.0253 7.39715 14.924 7.23501C13.3436 4.70638 10.6921 3 7.5 3ZM7.5 9.5C8.60457 9.5 9.5 8.60457 9.5 7.5C9.5 6.39543 8.60457 5.5 7.5 5.5C6.39543 5.5 5.5 6.39543 5.5 7.5C5.5 8.60457 6.39543 9.5 7.5 9.5Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                        <svg v-else width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13.3536 2.35355C13.5488 2.15829 13.5488 1.84171 13.3536 1.64645C13.1583 1.45118 12.8417 1.45118 12.6464 1.64645L10.6828 3.61012C9.70652 3.21671 8.63759 3 7.5 3C4.30786 3 1.65639 4.70638 0.0760002 7.23501C-0.0253338 7.39715 -0.0253334 7.60288 0.0760014 7.76501C0.902945 9.08812 2.02314 10.1861 3.36061 10.9323L1.64645 12.6464C1.45118 12.8417 1.45118 13.1583 1.64645 13.3536C1.84171 13.5488 2.15829 13.5488 2.35355 13.3536L4.31723 11.3899C5.29348 11.7833 6.36241 12 7.5 12C10.6921 12 13.3436 10.2936 14.924 7.76501C15.0253 7.60288 15.0253 7.39715 14.924 7.23501C14.0971 5.9119 12.9769 4.81391 11.6394 4.06771L13.3536 2.35355ZM9.90428 4.38861C9.15332 4.1361 8.34759 4 7.5 4C4.80285 4 2.52952 5.37816 1.09622 7.50001C1.87284 8.6497 2.89609 9.58106 4.09974 10.1931L9.90428 4.38861ZM5.09572 10.6114L10.9003 4.80685C12.1039 5.41894 13.1272 6.35031 13.9038 7.50001C12.4705 9.62183 10.1971 11 7.5 11C6.65241 11 5.84668 10.8639 5.09572 10.6114Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                    </button>
                    <div class="invalid-feedback" v-text="invalidFeedBack"></div>
                </div>
            `,
        };

        const app = createApp({
            setup() {
                const reset_password_form = useTemplateRef("reset_password_form");
                const error_message = ref('');
                const current_password = ref('');
                const new_password = ref('');
                const confirm_new_password = ref('');

                const show_error = (msg) => {
                    error_message.value = msg;
                    setTimeout(() => {
                        error_message.value = '';
                    }, 1500);
                }

                const submit = () => {
                    let form = reset_password_form.value;
                    let flag = false;

                    form.querySelectorAll('.needs-validation').forEach(el => {
                        if (!el.checkValidity()) {
                            event.preventDefault();
                            event.stopPropagation();
                            flag = true;
                        }

                        el.classList.add('was-validated');
                    })
                    if (flag) {
                        form.classList.add('was-validated');
                        return;
                    }

                    if (current_password.value === new_password.value) {
                        show_error('新密碼不可與原本的密碼相同');
                        return;
                    } else if (new_password.value !== confirm_new_password.value) {
                        show_error('新密碼與確認密碼不同');
                        return;
                    } else {
                        let special_char_pattern = /[~`!#$%\^&*+=\-\[\]\\';,/{}|\\":<>\?]/;
                        let alphabat_char_pattern = /[a-z]/i;
                        let number_char_pattern = /\d/;

                        if (!(new_password.value.length >= 8 && new_password.value.length <= 30)) {
                            show_error('密碼長度介在8到30之間');
                            return;
                        } else if (!(number_char_pattern.test(new_password.value) && alphabat_char_pattern.test(new_password.value) && special_char_pattern.test(new_password.value))) {
                            show_error('密碼必須含有數字、英文大小寫、特殊符號3種字元');
                            return;
                        }
                    }

                    post('{{ base_url }}/be/resetpw', {
                        reqtype: 'reset',
                        current_pw: current_password.value,
                        new_pw: new_password.value,
                        confirm_new_pw: confirm_new_password.value,
                    }).then(response => {
                        return response.text();
                    }).then(res => {
                        if (res[0] === "") {
                            error_message.value = '更新成功，請重新登入';
                            setTimeout(() => {
                                if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                                    location.href = "{{ base_url }}/exam/";
                                    return;
                                }

                                if (route.prev_url == null) {
                                    location.href = "{{ base_url }}/info/";
                                } else {
                                    location.href = route.prev_url;
                                }
                            }, 1500);
                        } else {
                            show_error(res);
                        }
                    });
                };

                return {
                    current_password, new_password, confirm_new_password,
                    error_message,
                    submit,
                }
            }
        });
        app.component('PasswordInput', PasswordInput);
        app.mount('#app');
    }
    init();
</script>

<style>
    button.submit {
        position: relative;
        left: 50%;
        transform: translate(-50%, -50%);
    }
</style>

<div class="row row-cols-1 row-cols-lg-3 justify-content-center align-content-center" style="height: 100%;">
    <div id="app" class="col mt-1">
        <form ref="reset_password_form" style="padding-top: 25%;">
            <h3 class="text-center">修改密碼</h3>
            <div class="alert alert-info">
                <h5>密碼強度限制:長度需介在8到30之間，且必須含有數字、英文大小寫、特殊符號3種字元</h5>
                <h5>其他限制:新密碼不可與前三次相同</h5>
                <h5>(這是校務系統的限制)</h5>
            </div>
            <div class="mb-4">
                <password-input v-model="current_password" :placeholder="`Current Password`" :invalid-feed-back="`請輸入原本的密碼`" :required="true"></password-input>
            </div>
            <div class="mb-4">
                <password-input v-model="new_password" :placeholder="`New Password`" :invalid-feed-back="`請輸入新的密碼`" :required="true"></password-input>
            </div>
            <div class="mb-4">
                <password-input v-model="confirm_new_password" :placeholder="`Confirm New Password`" :invalid-feed-back="`請再次輸入新的密碼`" :required="true"></password-input>
            </div>
            <div v-show="error_message !== ''" class="mb-5 mb-lg-3">
                <div class="alert alert-warning alert-dismissible" role="alert" v-text="error_message"></div>
            </div>
            <button @click="submit" type="button" class="btn btn-primary my-3" aria-label="update password button" tabindex="0">
                Update Password
            </button>
        </form>
    </div>
</div>
