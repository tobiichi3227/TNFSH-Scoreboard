<script>
    // from https://swf.com.tw/?p=94
    function checkID(idStr) {
        const LETTERS = {'A': 10, 'B': 11, 'C': 12, 'D': 13,'E': 14, 'F': 15, 'G': 16, 'H': 17, 'J':18, 'K':19, 'L':20, 'M':21,
                         'N':22, 'P':23, 'Q':24, 'R':25, 'S':26, 'T':27, 'U':28, 'V':29,
                         'X':30, 'Y':31, 'W':32, 'Z':33, 'I':34, 'O':35};
        const MULTIPLY = [1, 9, 8, 7, 6, 5, 4, 3, 2, 1, 1];
        const regExpID = /[a-z](1|2)\d{8}$/i;

        if (idStr.search(regExpID) === -1) {
            return false;
        }

        let nums = new Array(2);
        nums[0] = Math.floor(LETTERS[idStr[0]] / 10);
        nums[1] = LETTERS[idStr[0]] % 10;
        let total = nums
          .concat(idStr.slice(1).split('').map(num => parseInt(num, 10)))
          .map((val, idx) => val * MULTIPLY[idx])
          .reduce((a, c) => a + c);

        return total % 10 == 0;
    }

    function init() {
        const { createApp, ref, useTemplateRef } = Vue;
        createApp({
            setup() {
                const forget_password_form = useTemplateRef("forget_password_form");
                const account = ref('');
                const name = ref('');
                const birth = ref('');
                const id = ref('');
                const error_message = ref('');

                const show_error = (msg) => {
                    error_message.value = msg;
                    setTimeout(() => {
                        error_message.value = '';
                    }, 1500);
                }

                const submit = () => {
                    let form = forget_password_form.value;
                    let flag = false;

                    form.querySelectorAll('.needs-validation').forEach(el => {
                        if (!el.checkValidity()) {
                            event.preventDefault();
                            event.stopPropagation();
                            flag = true;
                        }

                        el.classList.add('was-validated');
                    })
                    if (flag) {
                        form.classList.add('was-validated');
                        return;
                    }

                    if (!checkID(id.value)) {
                        show_error("身份證字號格式錯誤");
                        return;
                    }

                    if (birth.value === '' || birth.value.length != 8 || isNaN(parseInt(birth.value)) || parseInt(birth.value) < 19500000) {
                        show_error("生日請輸入西元年共八位數字(yyyyMMdd)");
                        return;
                    }

                    let year = parseInt(birth.value.slice(0, 4));
                    let month = parseInt(birth.value.slice(4, 6)) - 1
                    let day = parseInt(birth.value.slice(6, 8));
                    let date = new Date(year, month, day);
                    if (date.getFullYear() !== year || date.getMonth() !== month || date.getDate() !== day) {
                        show_error("生日日期錯誤");
                        return;
                    }

                    error_message.value = "校務系統處理中";
                    post("{{ base_url }}/be/forgetpw", {
                        reqtype: "forget",
                        account: account.value,
                        name: name.value,
                        idno: id.value,
                        birth: birth.value,
                    }).then(response => {
                        return response.text();
                    }).then(res => {
                        let msg = "";
                        if (res[0] == "E") {
                            if (res == "Enoext") {
                                msg = "帳號不存在";
                            } else if (res == "Eremoteblock") {
                                msg = "被校務系統擋";
                            } else if (res == "Eparam") {
                                msg = "輸入資料錯誤";
                            }
                        } else {
                            msg = "請求發送成功，請在24小內完成密碼重設";
                        }
                        show_error(msg);
                    });
                };

                return {
                    account, name, birth, id,
                    forget_password_form, error_message,
                    submit,
                }
            }
        }).mount('#app');
    }
    init();
</script>

<style>
    button.submit {
        position: relative;
        left: 50%;
        transform: translate(-50%, -50%);
    }
</style>

<div class="row row-cols-1 row-cols-lg-3 justify-content-center align-content-center" style="height: 100%;">
    <div id="app" class="col mt-1">
        <form ref="forget_password_form" style="padding-top: 25%;">
            <h3 class="text-center">忘記密碼</h3>
            <p>
                為了確認您的身份，請輸入以下資料，核對無誤後，系統會將驗證信寄至您的E-mail信箱，<span style="color: red;">請在收到mail之後，點擊mail裡的url連結以完成驗證的程序</span>，之後即可使用預設密碼登入
            </p>
            <p>
                請不要隨意使用本功能，校務系統會擋
            </p>
            <div class="mb-4">
                <input type="text" v-model="account" class="form-control needs-validation" placeholder="帳號" required/>
                <div class="invalid-feedback">請輸入帳號</div>
            </div>
            <div class="mb-4">
                <input type="text" v-model="name" class="form-control needs-validation" placeholder="姓名" required/>
                <div class="invalid-feedback">請輸入姓名</div>
            </div>
            <div class="mb-4">
                <input type="text" v-model="birth" class="form-control needs-validation" placeholder="生日(格式:yyyyMMdd)" required/>
                <div class="invalid-feedback">請輸入生日</div>
            </div>
            <div class="mb-4">
                <input type="text" v-model="id" class="form-control needs-validation" placeholder="身份證字號" required/>
                <div class="invalid-feedback">請輸入身份證字號</div>
            </div>
            <div v-show="error_message !== ''" class="mb-5 mb-lg-3">
                <div class="alert alert-warning alert-dismissible" role="alert" v-text="error_message"></div>
            </div>
            <button @click="submit" type="button" class="btn btn-primary my-3" aria-label="send forget password request" tabindex="0">
                送出請求
            </button>
        </form>
    </div>
</div>
